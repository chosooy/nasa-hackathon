<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A9B6D3"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A65"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7FA8FF"/></marker>
  </defs>
  <style>
    .w { fill: #FFFFFF; } .m { fill: #A9B6D3; } .y { fill: #EAFE07; }
    .title { font-size: 40px; font-weight: 700; }
    .k { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .n { font-size: 24px; font-weight: 700; }
    .s { font-size: 17px; }
  </style>
  <rect width="1600" height="700" fill="#050E2A"/>

  <text x="60" y="92" class="w title">How crew data gets from Mars to Earth</text>

  <!-- side labels -->
  <text x="60" y="170" class="y k">MARS</text>
  <text x="1540" y="170" text-anchor="end" class="y k">EARTH</text>

  <!-- 1. readings -->
  <rect x="60" y="300" width="230" height="110" rx="20" fill="#0F2052" stroke="#2C4386" stroke-width="2"/>
  <text x="175" y="347" text-anchor="middle" class="w n">Readings</text>
  <text x="175" y="378" text-anchor="middle" class="m s">every 5 min</text>
  <path d="M290 355 H346" stroke="#A9B6D3" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- 2. status -->
  <rect x="350" y="300" width="230" height="110" rx="20" fill="#0F2052" stroke="#2C4386" stroke-width="2"/>
  <text x="465" y="347" text-anchor="middle" class="w n">Status</text>
  <text x="465" y="378" text-anchor="middle" class="m s">normal · potential · urgent</text>

  <!-- split -->
  <path d="M580 355 C 630 355, 630 250, 676 250" stroke="#FF8A65" stroke-width="2.5" fill="none" marker-end="url(#h)"/>
  <path d="M580 355 C 630 355, 630 460, 676 460" stroke="#7FA8FF" stroke-width="2.5" fill="none" marker-end="url(#c)"/>

  <!-- hot lane -->
  <rect x="680" y="195" width="400" height="110" rx="20" fill="#3A1E22" stroke="#FF8A65" stroke-width="2"/>
  <text x="710" y="240" fill="#FF8A65" class="n">HOT · Potential / Urgent</text>
  <text x="710" y="274" class="w s">zstd  ·  sent every minute</text>

  <!-- cold lane -->
  <rect x="680" y="405" width="400" height="110" rx="20" fill="#13295E" stroke="#7FA8FF" stroke-width="2"/>
  <text x="710" y="450" fill="#7FA8FF" class="n">COLD · Normal</text>
  <text x="710" y="484" class="w s">zstd + CCSDS packets  ·  sent every hour</text>

  <!-- link -->
  <path d="M1080 250 C 1160 250, 1180 330, 1246 340" stroke="#FF8A65" stroke-width="2.5" fill="none" stroke-dasharray="9 7" marker-end="url(#h)"/>
  <path d="M1080 460 C 1160 460, 1180 380, 1246 370" stroke="#7FA8FF" stroke-width="2.5" fill="none" stroke-dasharray="9 7" marker-end="url(#c)"/>
  <text x="1165" y="354" text-anchor="middle" class="y" font-size="30" font-weight="700">20 min</text>
  <text x="1165" y="378" text-anchor="middle" class="m" font-size="14">light delay</text>

  <!-- earth -->
  <rect x="1250" y="300" width="290" height="110" rx="20" fill="#1B2F10" stroke="#EAFE07" stroke-width="2"/>
  <text x="1395" y="347" text-anchor="middle" class="y n">Ground doctor</text>
  <text x="1395" y="378" text-anchor="middle" class="w s">verify · decompress · show</text>

  <!-- bottom summary -->
  <line x1="60" y1="580" x2="1540" y2="580" stroke="#22346B" stroke-width="1.5"/>
  <circle cx="72" cy="627" r="8" fill="#FF8A65"/>
  <text x="92" y="633" class="w s">Urgent data reaches the doctor in ~21 min</text>
  <circle cx="602" cy="627" r="8" fill="#7FA8FF"/>
  <text x="622" y="633" class="w s">Normal data arrives hourly, packed tighter</text>
  <circle cx="1132" cy="627" r="8" fill="#EAFE07"/>
  <text x="1152" y="633" class="w s">Chat has the same 20-min delay</text>
</svg>
