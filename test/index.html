<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOOK Test Bench</title>
<link rel="icon" href="../assets/logo/Favicon%20Logo.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --soft: #1c2129; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --faint: #848d97; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --danger: #f85149;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); display: flex; flex-direction: column; }

  /* settings bar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 600; }
  .bar label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  select, button { font: inherit; font-size: 13px; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; min-height: 32px; cursor: pointer; }
  select:hover, button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; min-width: 84px; }
  .primary:hover:not(:disabled) { background: #388bfd; border-color: #388bfd; }
  .spacer { flex: 1; }
  .now { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
  .now small { color: var(--muted); font: 400 12px var(--font); margin-left: 8px; }
  .progress { height: 2px; background: var(--line); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

  /* three cards */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); }
  .kind { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .kind b { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .kind span { font-size: 12px; color: var(--faint); }
  .size { font: 600 34px/1.15 var(--font); font-variant-numeric: tabular-nums; margin-top: 10px; }
  .size small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .card.hot .kind b { color: var(--warn); }
  .card.cold .kind b { color: var(--accent); }

  .list { flex: 1; min-height: 200px; overflow-y: auto; font: 12.5px/1.45 var(--mono); }
  .r { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 10px; padding: 4px 20px; align-items: baseline; }
  .r:nth-child(even) { background: rgba(255,255,255,.02); }
  .r .t { color: var(--faint); }
  .r .b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .v { text-align: right; font-variant-numeric: tabular-nums; }
  .r .v.Warning { color: var(--warn); }
  .r .v.Critical { color: var(--danger); }
  .r .s { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .r .s.sent { color: var(--ok); }
  .cold .r { grid-template-columns: minmax(0, 1fr) 3em 5.5em; }
  .cold .r .n { text-align: right; color: var(--faint); }
  .empty { color: var(--faint); padding: 18px 20px; font: 13px var(--font); }

  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } .list { max-height: 320px; } }
</style>
</head>
<body>
  <div class="bar">
    <h1>KOOK test bench</h1>
    <label>Crew <select id="crewSel"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
    <label>Day <select id="daySel"></select></label>
    <label>Speed <select id="speedSel">
      <option value="1000">1×</option>
      <option value="250" selected>4×</option>
      <option value="60">16×</option>
    </select></label>
    <button id="btnStart" class="primary" type="button" disabled>Start</button>
    <button id="btnReset" type="button" disabled>Reset</button>
    <span class="spacer"></span>
    <span class="now" id="now">--:--<small id="nowSub"></small></span>
  </div>
  <div class="progress"><i id="progress"></i></div>

  <main>
    <section class="card raw">
      <div class="head">
        <div class="kind"><b>RAW</b><span>every reading, CSV</span></div>
        <div class="size" id="rawSize">0 B</div>
        <div class="meta" id="rawMeta">Press Start to replay the day.</div>
      </div>
      <div class="list" id="rawList"></div>
    </section>

    <section class="card hot">
      <div class="head">
        <div class="kind"><b>HOT</b><span>Potential / Urgent · zstd · every second</span></div>
        <div class="size" id="hotSize">0 B</div>
        <div class="meta" id="hotMeta">Nothing sent yet.</div>
      </div>
      <div class="list" id="hotList"></div>
    </section>

    <section class="card cold">
      <div class="head">
        <div class="kind"><b>COLD</b><span>Normal · summary · CCSDS 121 · hourly</span></div>
        <div class="size" id="coldSize">0 B</div>
        <div class="meta" id="coldMeta">Builds up as Normal readings come in.</div>
      </div>
      <div class="list" id="coldList"></div>
    </section>
  </main>

<script type="module" src="app.js?v=7"></script>
</body>
</html>
