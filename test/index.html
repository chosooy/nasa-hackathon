<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOOK Test Bench</title>
<link rel="icon" href="../assets/logo/Favicon%20Logo.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #03081A; --panel: rgba(255,255,255,.1); --soft: rgba(255,255,255,.08); --line: rgba(255,255,255,.14);
    --text: #ffffff; --muted: #c9d3e6; --faint: #a9b4c8; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --danger: #f85149;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg) url("../assets/background/Background_Space.jpeg") center top / cover fixed; color: var(--text); font: 14px/1.5 var(--font); display: flex; flex-direction: column; }

  /* settings bar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 28px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(3,8,26,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .bar h1 { margin: 0 6px 0 0; font-size: 15px; font-weight: 600; }
  .bar label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  select, button { font: inherit; font-size: 13px; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; min-height: 32px; cursor: pointer; }
  select:hover, button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; min-width: 84px; }
  .primary:hover:not(:disabled) { background: #388bfd; border-color: #388bfd; }
  .spacer { flex: 1; }
  .stamp { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 44px 20px 4px; font-variant-numeric: tabular-nums; }
  .stamp img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; object-position: center 15%; border: 3px solid rgba(255,255,255,.25); }
  .stamp span { font: 500 40px/1 var(--mono); color: var(--muted); letter-spacing: -.02em; }
  .stamp b { font: 700 64px/1 var(--mono); letter-spacing: -.03em; }
  @media (max-width: 700px) { .stamp { gap: 12px; } .stamp img { width: 48px; height: 48px; } .stamp span { font-size: 20px; } .stamp b { font-size: 34px; } }
  option { background: #07173F; }
  .progress { height: 2px; background: var(--line); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

  /* three cards */
  main { width: min(1240px, 100%); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr) 64px minmax(0, 1fr); gap: 0; padding: 28px 20px; align-items: start; }
  .hop { align-self: start; margin-top: 46px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11.5px; text-align: center; }
  .hop i { font-style: normal; font-size: 22px; line-height: 1; color: var(--text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); }
  .kind { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .kind b { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .kind span { font-size: 12px; color: var(--faint); }
  .size { font: 600 34px/1.15 var(--font); font-variant-numeric: tabular-nums; margin-top: 10px; }
  .size small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .card.astro .kind b { color: #EAFE07; }
  .card.doctor .kind b { color: var(--accent); }

  .list { height: clamp(220px, 52vh, 480px); overflow-y: auto; font: 12.5px/1.45 var(--mono); }
  .r { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 10px; padding: 4px 20px; align-items: baseline; }
  .r:nth-child(even) { background: rgba(255,255,255,.04); }
  .r .t { color: var(--faint); }
  .r .b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .v { text-align: right; font-variant-numeric: tabular-nums; }
  .r .v.Warning { color: var(--warn); }
  .r .v.Critical { color: var(--danger); }
  .r .v.potential { color: var(--warn); }
  .r .v.urgent { color: var(--danger); }
  .r .s { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .astro .r, .doctor .r { grid-template-columns: 3.2em minmax(0, 1fr) auto; }
  .empty { color: var(--faint); padding: 18px 20px; font: 13px var(--font); }

  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); gap: 8px; } .hop { margin: 0; flex-direction: row; } .hop i { transform: rotate(90deg); } .list { max-height: 320px; } }
</style>
</head>
<body>
  <div class="bar">
    <h1>KOOK test bench</h1>
    <label>Crew <select id="crewSel"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
    <label>Day <select id="daySel"></select></label>
    <label>Speed <select id="speedSel">
      <option value="1000">1×</option>
      <option value="250" selected>4×</option>
      <option value="60">16×</option>
    </select></label>
    <button id="btnStart" class="primary" type="button" disabled>Start</button>
    <button id="btnReset" type="button" disabled>Reset</button>
  </div>
  <div class="progress"><i id="progress"></i></div>

  <div class="stamp"><img id="stampImg" src="../assets/image/web/A_profile.jpg" alt="Crew A"><span id="stampDate">2026-11-13</span><b id="stampTime">--:--</b></div>

  <main>
    <section class="card raw">
      <div class="head">
        <div class="kind"><b>RAW</b><span>device readings · CSV</span></div>
        <div class="size" id="rawSize">0 B</div>
        <div class="meta" id="rawMeta">Press Start to replay the day.</div>
      </div>
      <div class="list" id="rawList"></div>
    </section>

    <div class="hop" aria-hidden="true"><i>→</i>zstd</div>

    <section class="card astro">
      <div class="head">
        <div class="kind"><b>ASTRONAUT DASHBOARD</b><span>Mars · right away</span></div>
        <div class="size" id="astroSize">0 B</div>
        <div class="meta" id="astroMeta">One zstd file per 5-minute slot, every status.</div>
      </div>
      <div class="list" id="astroList"></div>
    </section>

    <div class="hop" aria-hidden="true"><i>→</i>+20 min</div>

    <section class="card doctor">
      <div class="head">
        <div class="kind"><b>DOCTOR DASHBOARD</b><span>Earth · 20 min later</span></div>
        <div class="size" id="docSize">0 B</div>
        <div class="meta" id="docMeta">The same files arrive 20 minutes after they were measured.</div>
      </div>
      <div class="list" id="docList"></div>
    </section>
  </main>

<script type="module" src="app.js?v=10"></script>
</body>
</html>
